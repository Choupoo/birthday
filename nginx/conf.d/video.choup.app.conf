map $http_upgrade $video_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name video.choup.app;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/private-site.conf;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 20m;

    location / {
        set $decotv_upstream decotv:3000;
        proxy_pass http://$decotv_upstream;
        proxy_http_version 1.1;
        # Keep nonstandard local HTTPS ports in generated playback URLs.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Nginx Basic Auth is separate from DecoTV's cookie-based login.
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $video_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
    }
}
