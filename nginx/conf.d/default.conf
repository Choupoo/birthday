# Unknown hostnames do not expose any project.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    return 444;
}

# Ask for credentials only after upgrading to HTTPS.
server {
    listen 80;
    server_name choup.app superlu.choup.app;
    return 308 https://$host$request_uri;
}

# Health endpoint is accessible only inside this container.
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    access_log off;
    location = /healthz {
        return 200 "ok\n";
    }
    location / {
        return 404;
    }
}
