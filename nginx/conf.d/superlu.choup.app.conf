server {
    listen 443 ssl;
    http2 on;
    server_name superlu.choup.app;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/private-site.conf;

    # Re-resolve Docker DNS when a project container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $birthday_upstream birthday:80;
        proxy_pass http://$birthday_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_hide_header Cache-Control;
    }
}
